<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarea: Lista de tareas</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input { flex: 1; padding: 0.4rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border-bottom: 1px solid #ccc; }
    li span { flex: 1; }
    li.hecha span { text-decoration: line-through; color: #888; }
  </style>
</head>
<body>
  <h1>Mi lista de tareas</h1>

  <form id="formTarea">
    <input type="text" id="textoTarea" placeholder="Escribe una tarea" required>
    <button type="submit">Agregar</button>
  </form>

  <p id="contador">Pendientes: 0</p>
  <ul id="listaTareas"></ul>

  <script src="app.js"></script>
</body>
</html>
